# Bush Drift for iOS: xcodegen spec. ./ios/gen-project.sh writes ios/BushDrift.xcodeproj from it (not committed).
name: BushDrift
options:
  bundleIdPrefix: io.github.aedyle
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: "${BD_IOS_TEAM}"   # your team ID, from ios/team.local (see ios/README.md)
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"     # iPhone
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GCC_C_LANGUAGE_STANDARD: gnu99
    CLANG_ENABLE_OBJC_ARC: YES
    GCC_WARN_INHIBIT_ALL_WARNINGS: NO
    WARNING_CFLAGS: "-Wno-deprecated-declarations -Wno-unused-parameter -Wno-shorten-64-to-32 -Wno-comma -Wno-conversion"
targets:
  BushDrift:
    type: application
    platform: iOS
    sources:
      - path: ../src/main.c
      - path: ../src/car.c
      - path: ../src/tuning.c
      - path: ../src/bench.c
      - path: ../src/records.c
      - path: ../src/route.c
      - path: ../src/erecords.c
      - path: bd_ios.c
      - path: bd_ios_audio.m
      - path: raudio_ios.m
      - path: third/raylib-6.2/src/rcore.c
      - path: third/raylib-6.2/src/rshapes.c
      - path: third/raylib-6.2/src/rtextures.c
      - path: third/raylib-6.2/src/rtext.c
      - path: third/raylib-6.2/src/rmodels.c
      - path: Assets.xcassets
    dependencies:
      - framework: lib/SDL3.xcframework
        embed: false
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
      - sdk: OpenGLES.framework
      - sdk: Metal.framework
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: CoreMotion.framework
      - sdk: CoreHaptics.framework
      - sdk: GameController.framework
      - sdk: CoreBluetooth.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aedyle.bushdrift
        PRODUCT_NAME: BushDrift
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/include"
          - "$(SRCROOT)/../build"
          - "$(SRCROOT)/third/raylib-6.2/src"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "BD_IOS=1"
          - "NO_SAMPLES=1"
          - "_DEFAULT_SOURCE=1"
          - "PLATFORM_DESKTOP_SDL=1"
          - "USING_SDL3_PROJECT=1"
          - "GRAPHICS_API_OPENGL_ES3=1"
          - "GLES_SILENCE_DEPRECATION=1"
        OTHER_LDFLAGS: "-lc++"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Bush Drift
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen:
          UIColorName: LaunchBackground
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
    preBuildScripts:
      - name: Tuning defaults
        script: |
          cd "$SRCROOT/.." && make build/tuning_defaults.h >/dev/null
        basedOnDependencyAnalysis: false
    postCompileScripts:
      - name: Game files
        # the same files, at the same paths, as android/build.sh and web/build.sh pack
        script: |
          set -e
          R="$SRCROOT/.."
          D="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$D/data/built" "$D/assets-built" "$D/assets/sfx"
          for f in route.csv meta.txt terrain.bin canopy.bin far.bin; do cp "$R/data/built/$f" "$D/data/built/"; done
          for f in plants.txt hut.txt lc79.car; do cp "$R/assets-built/$f" "$D/assets-built/"; done
          cp "$R"/assets/sfx/*.ogg "$D/assets/sfx/"
        basedOnDependencyAnalysis: false
schemes:
  BushDrift:
    build:
      targets:
        BushDrift: all
    run:
      config: Debug
  BushDrift Bench:   # the road bot drives 7,200 frames (2 minutes at 60 fps); frame times go to the console log
    build:
      targets:
        BushDrift: all
    run:
      config: Release
      commandLineArguments:
        "--bench 7200 --bot 6": true
